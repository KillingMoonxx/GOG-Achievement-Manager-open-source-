name: Go

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
    - name: Build CLI
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o gog-achievements.exe ./cmd/gog-achievements
    - name: Build GUI
      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o gog-achievements-gui.exe ./cmd/gog-achievements-gui
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: gog-achievements-${{ matrix.goarch }}-${{ matrix.goos }}
        path: |
          gog-achievements.exe
          gog-achievements-gui.exe
